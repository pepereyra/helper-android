name: Android CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests del dominio y de la app, y APK de debug
        run: ./gradlew --no-daemon :domain:test :app:testDebugUnitTest :app:assembleDebug

      - name: Subir el APK
        uses: actions/upload-artifact@v4
        with:
          name: helper-debug-apk
          path: app/build/outputs/apk/debug/*.apk
